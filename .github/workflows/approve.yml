name: Odobri supplement (draft → live)

# Pošto pregledaš review i sve je OK, ovim dugmetom prebaciš supplement iz
# 'draft' u 'live' (postaje vidljiv u aplikaciji). Sve iz browsera.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug suplementa za odobravanje, npr. probiotics'
        required: true

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r pipeline/requirements.txt
      - name: Odobri
        working-directory: pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingest.py --approve "${{ github.event.inputs.slug }}"
